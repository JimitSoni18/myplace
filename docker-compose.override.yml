services:
  app:
    build:
      target: development
    command: sh -c "cargo run --bin migrate && cargo watch -i 'frontend/**' -i 'target/**' -x 'run --bin myplace'"
    environment:
      # - CARGO_TARGET_DIR=/tmp/target
    volumes:
      - .:/app
      - cargo_cache:/usr/local/cargo/registry
      - cargo_target:/app/target
  db:
    ports:
      - 5432:5432

volumes:
  cargo_cache:
  cargo_target:
