# =============================================================================
# Render Blueprint Specification for MyPlace
# =============================================================================
# Architecture:
# 1. Managed PostgreSQL Database (myplace-db)
# 2. Main Web Application (myplace)
#    - Native Rust runtime (runtime: rust)
#    - Path-multiplexed server on port 10000 (public: /, admin: /admin, owner: /owner, auth: /auth)
#    - Automatic embedded migrations & admin seed via preDeployCommand
#    - Object storage hosted on Supabase Storage (S3-compatible)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Main Path-Multiplexed Web Application
  # ---------------------------------------------------------------------------
  - type: web
    name: myplace
    runtime: rust
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    buildCommand: "SQLX_OFFLINE=true cargo build --release"
    preDeployCommand: "./target/release/migrate && ./target/release/seed"
    startCommand: "./target/release/myplace"
    envVars:
      - key: APP_ENV
        value: production
      - key: SQLX_OFFLINE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: myplace-db
          property: connectionString
      - key: MAX_DB_CONNECTIONS
        value: "10"
      - key: COOKIE_SIGNING_SECRET
        generateValue: true
      - key: JWT_PRIVATE_KEY
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: PORT
        value: "10000"
      - key: PUBLIC_PORT
        value: "10000"
      - key: ENABLE_ROUTE_MULTIPLEXING
        value: "true"
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: ADMIN_SITE_ORIGIN
        sync: false
      - key: OWNER_SITE_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: ASSET_BASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

databases:
  # ---------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: myplace-db
    databaseName: myplace_w9wz
    user: myplace_user
    plan: free
    region: singapore
