{% extends "admin/base.html" %}

{% block content %}
<header class="page-header">
	<h2>{{ page }}</h2>

	<div id="form-actions">
		<form class="search-form">
			{% block filters %}{% endblock %}
			<input
				type="search"
				name="q"
				{% if let Some(q) = q %}
				value="{{ q }}"
				{% endif %}
				placeholder="Search {{ page | lower }}"
			>

			<button type="submit">Apply</button>
		</form>

		{% block new_action %}
		{% if page != AdminPage::Properties %}
		<a href="/admin/{{ page | lower }}/new" class="btn">+ New {{ page | lower }}</a>
		{% endif %}
		{% endblock %}
	</div>
</header>

<section id="table-container">
	{% block table_content %}{% endblock %}
</section>

<style>
/* small scoped additions */
.page-header {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: .5rem;
	margin-bottom: .5rem;
}

.page-header h2 {
	margin: 0;
	font-size: 1.1rem;
}

/* push search + button to right */
.search-form {
	display: flex;
	gap: .25rem;
}

.search-form input {
	border: 1px solid var(--border);
	padding: .25rem .4rem;
	border-radius: 4px;
	font-size: .9rem;
}

.search-form button {
	border: 1px solid var(--border);
	background: var(--bg-panel);
	padding: .25rem .5rem;
	border-radius: 4px;
	cursor: pointer;
	font-size: .9rem;
}

.search-form button:hover {
	background: #f0e3d6;
}

#form-actions {
	display: flex;
	gap: .25rem;
	align-items: center;
}

.btn {
	text-decoration: none;
	background: var(--accent);
	color: white;
	padding: .35rem .6rem;
	border-radius: 4px;
	font-size: .9rem;
}

.btn:hover {
	background: var(--accent-dark);
}

table {
	width: 100%;
	border-collapse: collapse;
	margin-top: .5rem;
}

th,
td {
	padding: .4rem .5rem; border-bottom: 1px solid var(--border);
	font-size: .9rem;
}

th {
	font-weight: 600;
	color: var(--accent-dark);
}

.link-button {
	background: none;
	border: none;
	color: #a33;
	cursor: pointer;
	padding: 0;
	font-size: .9rem;
}

.link-button:hover {
	text-decoration: underline;
}

.actions {
	white-space: nowrap;
}

.action-link {
	background: none;
	border: none;
	padding: 0;
	margin-right: 8px;

	font: inherit;
	font-size: 0.9rem;

	color: var(--accent);
	cursor: pointer;
	text-decoration: none;
}

.action-link:hover {
	text-decoration: underline;
}

.action-link.danger {
	color: #a33;
}

.action-link.danger:hover {
	color: #822;
}

#content {
	display: flex;
	flex-direction: column;
	height: 100%;
}

#table-container {
	overflow-y: auto;
}

@media (max-width: 650px) {
	.page-header {
		flex-direction: column;
		align-items: unset;
	}

	#form-actions {
		justify-content: space-between;
	}
}
</style>
{% endblock %}
