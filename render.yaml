# =============================================================================
# Render Blueprint Specification for MyPlace
# =============================================================================
# Deploys:
# 1. Render Managed PostgreSQL Database (myplace-db)
# 2. Public Web Service (myplace-public)
# 3. Admin Web Service (myplace-admin)
# 4. Owner Web Service (myplace-owner)
#
# Each service builds from GitHub using the multi-stage Dockerfile.
# Server boundaries are strictly maintained.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Public Server Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: myplace-public
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    preDeployCommand: "./migrate && ./seed"
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myplace-db
          property: connectionString
      - key: MAX_DB_CONNECTIONS
        value: "10"
      - key: COOKIE_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_PORT
        value: "10000"
      - key: ADMIN_PORT
        value: "8081"
      - key: OWNER_PORT
        value: "8082"
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: ADMIN_SITE_ORIGIN
        sync: false
      - key: OWNER_SITE_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: ASSET_BASE_URL
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true

  # ---------------------------------------------------------------------------
  # 2. Admin Server Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: myplace-admin
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myplace-db
          property: connectionString
      - key: MAX_DB_CONNECTIONS
        value: "10"
      - key: COOKIE_SIGNING_SECRET
        fromService:
          type: web
          name: myplace-public
          envVarKey: COOKIE_SIGNING_SECRET
      - key: ADMIN_PORT
        value: "10000"
      - key: PUBLIC_PORT
        value: "8080"
      - key: OWNER_PORT
        value: "8082"
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: ADMIN_SITE_ORIGIN
        sync: false
      - key: OWNER_SITE_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: ASSET_BASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 3. Project Owner Server Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: myplace-owner
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: myplace-db
          property: connectionString
      - key: MAX_DB_CONNECTIONS
        value: "10"
      - key: COOKIE_SIGNING_SECRET
        fromService:
          type: web
          name: myplace-public
          envVarKey: COOKIE_SIGNING_SECRET
      - key: OWNER_PORT
        value: "10000"
      - key: PUBLIC_PORT
        value: "8080"
      - key: ADMIN_PORT
        value: "8081"
      - key: PUBLIC_SITE_ORIGIN
        sync: false
      - key: ADMIN_SITE_ORIGIN
        sync: false
      - key: OWNER_SITE_ORIGIN
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: ASSET_BASE_URL
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: myplace-db
    databaseName: myplace
    user: myplace_user
    plan: basic
    region: oregon
